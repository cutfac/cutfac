name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The checks never launch the desktop app, so skip Electron's binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      # The media tests skip without ffmpeg; install it so they run. A static build from GitHub
      # releases takes seconds, where apt-get update sometimes stalled for over ten minutes.
      - name: Install ffmpeg
        timeout-minutes: 3
        env:
          FFMPEG_BUILD: ffmpeg-n8.1-latest-linux64-gpl-8.1
        run: |
          cd "$RUNNER_TEMP"
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          curl -fsSL --retry 3 -O "$base/$FFMPEG_BUILD.tar.xz" -O "$base/checksums.sha256"
          grep " $FFMPEG_BUILD.tar.xz\$" checksums.sha256 | sha256sum -c -
          tar -xJf "$FFMPEG_BUILD.tar.xz"
          echo "$RUNNER_TEMP/$FFMPEG_BUILD/bin" >> "$GITHUB_PATH"
          "$FFMPEG_BUILD/bin/ffmpeg" -hide_banner -version | head -1
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build
