name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The checks never launch the desktop app, so skip Electron's binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # The media tests skip without ffmpeg, so CI installs BtbN's static build; apt-get update
      # sometimes stalled for over ten minutes. BtbN rebuilds "latest" daily and can replace a
      # release's files, so CI takes one dated build and checks it against a hash kept here.
      FFMPEG_RELEASE: autobuild-2026-10-27-18-38
      FFMPEG_BUILD: ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-8.1
      FFMPEG_SHA256: 292e10a463befababcd31e0c7d0c1e068d46342398d9674534eb07517c1ba38e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Restore ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ${{ env.FFMPEG_BUILD }}
      - name: Download ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -O "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_RELEASE/$FFMPEG_BUILD.tar.xz"
          echo "$FFMPEG_SHA256  $FFMPEG_BUILD.tar.xz" | sha256sum -c -
          tar -xJf "$FFMPEG_BUILD.tar.xz" "$FFMPEG_BUILD/bin/ffmpeg" "$FFMPEG_BUILD/bin/ffprobe"
          mkdir -p ffmpeg
          mv "$FFMPEG_BUILD/bin/ffmpeg" "$FFMPEG_BUILD/bin/ffprobe" ffmpeg/
      - name: Put ffmpeg on PATH
        run: |
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -hide_banner -version | head -1
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build
