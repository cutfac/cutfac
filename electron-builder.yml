# yaml-language-server: $schema=node_modules/app-builder-lib/scheme.json
appId: dev.cutfac.app
productName: Cutfac
copyright: Copyright © Cutfac contributors
directories:
  output: release

# The app bundle ships only the bundled Electron main and preload. Everything else is self-contained:
# the server is a compiled binary and the board is a static build, both added as extraResources.
# So no node_modules goes into the asar.
files:
  - dist/electron/**
  - package.json
  - "!node_modules"
npmRebuild: false

extraResources:
  - from: dist/sidecar/cutfac
    to: bin/cutfac
  - from: dist/web
    to: web

# Switches baked into the Electron binary right before signing. The signed app can't be started as
# plain Node or with NODE_OPTIONS or a debugger, so other programs can't borrow its permissions, and
# it loads only its own app.asar, checked against the hash in Info.plist, so the code can't be
# swapped. The app forks no Node processes and loads no file:// pages, so it needs none of these.
# Flipping them breaks the binary's ad-hoc signature, which an unsigned build (`dist:desktop`)
# needs reset to launch on Apple Silicon; a signed build signs over it.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true

mac:
  category: public.app-category.productivity
  # An Icon Composer bundle: Liquid Glass on macOS 26, with flat fallbacks for older systems.
  icon: build/icon.icon
  # The zip is what the app downloads to update itself; people install from the dmg.
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  artifactName: cutfac-${version}-${arch}.${ext}
  # Signed with the Developer ID certificate in the keychain, under the hardened runtime with
  # build/entitlements.mac*.plist. Notarized when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
  # APPLE_TEAM_ID are set; `bun run release` requires them.

# Where the app checks for updates (it goes into app-update.yml). The site redirects to a short-lived
# link into the private release bucket, with no license key involved.
# `bun run release` uploads the builds; electron-builder publishes nothing itself.
publish:
  provider: generic
  url: https://cutfac.com/api/updates/mac
